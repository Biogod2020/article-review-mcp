<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article Review MCP</title><style>
:root{color-scheme:light dark;--bg:#eef1f5;--paper:#fff;--ink:#202733;--muted:#687386;--line:#d9dee7;--blue:#2563eb;--green:#067647;--greenbg:#dcfae6;--red:#b42318;--redbg:#fee4e2;--amber:#b54708;--amberbg:#ffead5;--purple:#6d28d9;--purplebg:#ede9fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}body.dark{--bg:#111827;--paper:#182232;--ink:#e5e7eb;--muted:#9ca3af;--line:#344155;--greenbg:#123a2a;--redbg:#482423;--amberbg:#4b3519;--purplebg:#34215b}.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}.title{min-width:220px;flex:1}.title b{display:block;font-size:15px}.summary{font-size:11px;color:var(--muted)}button,input,select,textarea{font:inherit;color:inherit}.control{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}button{cursor:pointer}.active{outline:2px solid color-mix(in srgb,var(--blue) 32%,transparent)}.topicbar{position:sticky;top:57px;z-index:19;display:flex;gap:6px;align-items:center;overflow:auto;padding:8px 14px;background:color-mix(in srgb,var(--paper) 96%,var(--bg));border-bottom:1px solid var(--line)}.topic{white-space:nowrap;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}.topic small{margin-left:4px;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;max-width:1750px;margin:auto;padding:14px}.paper,.panel{background:var(--paper);border:1px solid var(--line);border-radius:9px;overflow:hidden}.legend,.split{display:grid;grid-template-columns:1fr 1fr}.legend{color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}.legend div,.cell{padding:9px 12px}.legend div+div,.after{border-left:1px solid var(--line)}.hunk{border-bottom:1px solid var(--line);scroll-margin-top:125px;transition:opacity .15s}.hunk. </style></head><body><header class="bar"><div class="title"><b id="title">Article Review MCP</b><span class="summary" id="summary">Waiting for data…</span></div><button class="control active mode" data-mode="split">Split</button><button class="control mode" data-mode="unified">Unified</button><button class="control mode" data-mode="final">Final</button><select id="filter" class="control"><option value="all">All states</option><option value="pending">Pending</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option><option value="edited">Edited</option></select><input id="search" class="control" placeholder="Search patches or comments…"><button id="focus" class="control">Dim unrelated</button><button id="acceptVisible" class="control">Accept visible</button><button id="rejectVisible" class="control">Reject visible</button></header><nav id="topics" class="topicbar"><span class="summary">Topics load with a review.</span></nav><div id="error" class="error hidden"></div><main class="workspace"><section id="paper" class="paper"><div id="legend" class="legend"><div>Original</div><div>Proposed patch</div></div><div id="hunks"><div class="empty">No review loaded.</div></div><pre id="document" class="finaldoc hidden"></pre><div id="pager" class="pager hidden"><button id="prev" class="mini">Previous</button><span id="pageinfo"></span><button id="next" class="mini">Next</button></div></section><aside class="aside"><section class="panel"><h3 id="commentTitle">Comments</h3><div id="comments" class="comments"><div class="empty">Select a patch.</div></div><form id="form" class="form"><input id="reviewer" value="Human reviewer" placeholder="Reviewer"><select id="commentTopic"></select><select id="severity"><option value="suggestion">Suggestion</option><option value="minor">Minor</option><option value="major">Major</option><option value="critical">Critical</option></select><textarea id="comment" placeholder="Comment on selected patch"></textarea><button class="control" type="submit">Add categorized comment</button></form></section></aside></main><script>
